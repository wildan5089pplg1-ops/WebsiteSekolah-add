name: Auto Deploy to Webuzo

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.WEBUZO_HOST }}
          username: ${{ secrets.WEBUZO_USERNAME }}
          password: ${{ secrets.WEBUZO_PASSWORD }}
          port: ${{ secrets.WEBUZO_PORT }}
          script: |
            # 1. Masuk ke folder instalasi website Anda di server Webuzo
            # PENTING: Ganti PATH ini sesuai dengan lokasi folder project Anda di server
            cd /home/username/public_html/web-sekolah-main
            
            # 2. Tarik update terbaru dari git branch main
            git pull origin main
            
            # 3. Proses Build Frontend
            cd frontend
            npm install
            npm run build
            
            # 4. Restart aplikasi Node.js Anda
            # Jika Webuzo Anda menggunakan PM2, hilangkan tanda '#' di bawah ini dan ganti nama aplikasinya:
            # pm2 restart web-sekolah-frontend
